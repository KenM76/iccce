# iccce CI — build and test on Linux AND Windows from the first commit.
#
# WHY both from day one (ROADMAP.md Pass 0): the sibling project's
# `main` did not compile on Linux for weeks because nothing checked.
# The check exists before there is anything interesting to check, so it
# can never be "added later".
#
# fmt and clippy run on Linux only — their verdicts are
# platform-independent, and running them twice buys nothing.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # The `oracle` job below is manual-only. See its comment for why.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors in CI (and only in CI, so local iteration stays
  # frictionless). A warning that survives to CI is a decision nobody
  # made.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace --all-targets
      # ★ A GREEN TICK HERE DOES NOT EVIDENCE THE ANNEX D GROUND-TRUTH
      # CLAIM. `crates/iccce-cmm/tests/annex_d_ground_truth.rs` reads
      # ICC © 2022 published values that are deliberately NOT in this
      # repository (they are held locally; see that file's header). No
      # runner has them and none sets $ICCCE_PRIVATE_FIXTURES, so that
      # test is permanently in its SKIPPING case here — it prints a
      # loud SKIPPED banner to stderr and asserts nothing. That is by
      # design, and it is written down because a green badge covering a
      # test that never ran is precisely the false-green this project
      # has shipped twice before.
      - name: Test workspace
        run: cargo test --workspace

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # ★ rustdoc is a SEPARATE warning channel from rustc. The `RUSTFLAGS:
      # -D warnings` above does NOT reach it — rustdoc reads RUSTDOCFLAGS —
      # so broken intra-doc links were invisible to this job from the first
      # commit. On 2026-08-12 an audit found 11 of them sitting in the tree
      # (7 were `[0,1]` in prose, which rustdoc parses as a link target and
      # silently drops from the rendered page; 2 pointed at `#[cfg(test)]`
      # items that do not exist in a doc build; 2 pointed at private types).
      #
      # This matters more than a normal lint because docs.rs renders these
      # crates for every published version and a dropped link is invisible
      # in the source — you only see it as missing text on the page. Per
      # DL-009 the docs are part of what gets published, so they get the
      # same "a warning that survives to CI is a decision nobody made"
      # treatment as the code.
      - name: rustdoc (intra-doc links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  # ===================================================================
  # wasm32 — a CONSUMER'S gate, enforced here so it cannot break there
  # ===================================================================
  #
  # ★ WHY THIS EXISTS, and why "it passes today" was not good enough.
  #
  # `pdfce` — a PDF engine, the consumer this project's README names
  # first — must compile `pdfce-core` and `pdfce-render` for
  # `wasm32-unknown-unknown`, and it enforces that in ITS CI. It is the
  # whole reason its GUI is a separate crate.
  #
  # So: **any dependency added to a library crate here can break a
  # consumer's CI gate, in their repository, on a commit they did not
  # write.** Before this job existed, iccce could only offer a DATED
  # OBSERVATION — "measured 2026-08-17 at tip e21154c, exit 0" — which
  # is not a guarantee, and which was reported to pdfce as explicitly
  # not one. It was recorded as owed across four consecutive filings.
  #
  # This converts the observation into a gate. That is the difference
  # between telling a consumer "we checked once" and "we check every
  # time".
  #
  # ★ WHY ONLY THE LIBRARY CRATES. `iccce-cli` is a binary: it reads
  # files, writes stdout and returns an ExitCode, none of which exists
  # on `wasm32-unknown-unknown` as a bare target. It is not what a
  # consumer links, and requiring it to cross would force exactly the
  # kind of cfg contortion that makes a codebase worse to protect a
  # property nobody needs.
  #
  # ★ WHY `build` AND NOT `test`. There is no test runner on bare
  # wasm32. `cargo test --target wasm32-unknown-unknown` would need
  # wasm-bindgen-test and a browser or node harness — a real dependency,
  # added to protect a check that the build already makes. The claim
  # being gated is "this compiles and links for the web target", and
  # `build` is exactly that claim.
  #
  # ★ THE STRUCTURAL CHECK IS THE OTHER HALF. A successful wasm build
  # today does not prove the tree is still dependency-free tomorrow —
  # a pure-Rust dependency would cross wasm32 happily and still be a
  # supply-chain and licence event for a consumer that classifies every
  # dependency before adding it. `cargo tree` is therefore asserted
  # separately, and it is the check with the longer reach.
  wasm32:
    name: wasm32-unknown-unknown (library crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the library crates for wasm32
        run: >
          cargo build --target wasm32-unknown-unknown
          -p iccce-color -p iccce-profile -p iccce-cmm -p iccce-measure
      # ★ The dependency graph must stay OURS. Not "small" — ours.
      # `pdfce` takes no copyleft anywhere in a dependency tree and
      # classifies every dependency before adding it; the strongest
      # thing iccce can offer is a tree with nothing in it to classify.
      #
      # The gate is: every line of `cargo tree` names an `iccce-*` crate
      # AND carries a local path. Anything else — however permissive,
      # however small — is a decision that must be made deliberately by
      # a human reading a licence, not acquired by a `cargo add`. This
      # job's failure message is that sentence.
      #
      # ★ THE PATTERN REQUIRES THE PARENTHESISED PATH, and that is not
      # decoration. The first version matched on the name alone
      # (`^iccce-`), and injection testing found the hole: a crate
      # PUBLISHED TO crates.io as `iccce-evil` would have passed, because
      # it is named like ours. `cargo tree` renders a path dependency as
      #     iccce-cmm v0.0.1 (/path/to/crates/iccce-cmm)
      # and a registry dependency with no parenthesised location at all,
      # so requiring the path distinguishes "our crate" from "a crate
      # that chose our prefix". Name-based trust is exactly the
      # assumption a typosquat is built to exploit.
      #
      # Verified by injection before this job was committed: a permissive
      # dep, a copyleft dep, a transitive dep, a prefix-lookalike
      # (`iccceX-evil`) and a registry namesake (`iccce-evil`) are all
      # caught; the real tree stays green.
      - name: The dependency tree contains only iccce crates
        run: |
          set -eu
          tree=$(cargo tree --workspace --target wasm32-unknown-unknown --prefix none --no-dedupe)
          echo "$tree"
          foreign=$(echo "$tree" | awk 'NF && $0 !~ /^iccce-[a-z]+ v[0-9][0-9.]* \(/ {print $1}' | sort -u || true)
          if [ -n "$foreign" ]; then
            echo "::error::A non-iccce crate has entered the dependency tree:"
            echo "$foreign"
            echo "pdfce takes NO copyleft anywhere in a dependency tree and classifies every"
            echo "dependency before adding it. Adding one here is an operator decision (rule 8),"
            echo "not something acquired by a cargo add. If this is intended, update this job."
            exit 1
          fi
          echo "OK: every crate in the tree is an iccce crate."

  # ===================================================================
  # tools/ — 71 tests that gated NOTHING until 2026-08-12
  # ===================================================================
  #
  # ★ WHY THIS JOB HAS TO EXIST, and why its absence was structural
  # rather than an oversight.
  #
  # `tools/difftest` and `tools/gen-profiles` are deliberately NOT
  # workspace members. That is a load-bearing decision (see the root
  # Cargo.toml and tools/difftest/README.md §1): keeping the harness
  # outside the workspace is what guarantees a shipping crate can never
  # acquire an lcms2 dependency, even accidentally, and that `cargo
  # tree` on a published crate cannot reach the oracle.
  #
  # The cost of that isolation is that `cargo test --workspace` —
  # everything the `test` job above runs — CANNOT REACH THEM. So the
  # same boundary that protects the shipping crates also hid, from CI:
  #
  #   * tools/difftest      the differential harness itself, including
  #                         the candidate-separation classifier that
  #                         decides whether a conformance row has any
  #                         power at all
  #   * tools/gen-profiles  the generator that PRODUCES the synthetic
  #                         fixture corpus every other test in this
  #                         repository is measured against
  #
  # ★ NO TEST COUNT IS STATED HERE, and that is deliberate — DL-034.
  # This comment originally read "43 tests" and "28 tests". Within
  # hours the harness gained the third Pass 5c arm and became 47, so
  # the file asserted a wrong number twice while sitting beside the job
  # that computes the right one. That is the fifth recorded instance of
  # the same defect, and it was written by the same author who adopted
  # the rule against it earlier the same day — which is the argument
  # for the rule being mechanical rather than attentional.
  #
  # A YAML comment cannot format a value at run time, so DL-034's
  # remedy is unavailable and the correct move is the other one: DO NOT
  # STATE A NUMBER THE RUN WILL STATE FOR YOU. The job's own output
  # carries the counts, always current, on every run. Where a magnitude
  # genuinely helps a reader, anchor it to a tip and date it, so it
  # reads as a dated observation rather than a live claim.
  #
  # An untested fixture generator is the worst of the two: a bug there
  # does not fail, it silently changes what "correct" means for the
  # whole suite.
  #
  # ★ WHY THIS JOB NEEDS NO lcms2. The oracle is invoked as a
  # SUBPROCESS (`transicc`), never linked — there is no build.rs, no
  # `links` key, and no lcms2 crate. Verified before writing this job,
  # as a DATED OBSERVATION rather than a live claim: at tip `2835d23`
  # on 2026-08-12, with `ICCCE_TRANSICC` pointed at a non-existent
  # path, `cargo test` in tools/difftest was 43 passed / 0 failed, exit
  # 0. (It is 47 at `6c7cda1`; the count moves, the PROPERTY does not,
  # and the property is what this paragraph is about.) The tests that
  # NEED the oracle live in the runner binary, which is the `oracle`
  # job below.
  #
  # Both trees were also confirmed to build clean under this workflow's
  # global `RUSTFLAGS: -D warnings` before the job was added, so it does
  # not go red on pre-existing lint debt.
  harness:
    name: tools/ build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + test the differential harness
        working-directory: tools/difftest
        run: cargo test --all-targets
      - name: Build + test the fixture generator
        working-directory: tools/gen-profiles
        run: cargo test --all-targets
      # The corpus is generated, committed, and must stay byte-identical:
      # a fixture that drifts silently re-bases every measurement taken
      # against it. `verify` regenerates and compares without writing.
      - name: Fixture corpus is byte-identical to its recipes
        working-directory: tools/gen-profiles
        run: cargo run --release -- verify ../../fixtures/synthetic

  # ===================================================================
  # oracle — the full 142-row conformance suite. MANUAL ONLY, for now.
  # ===================================================================
  #
  # ★ WHY `workflow_dispatch` AND NOT `push`.
  #
  # `tools/difftest/build-lcms2.sh` says of itself: "NOT YET EXERCISED
  # … the development machine is Windows-only and has no POSIX C
  # toolchain. It is here so CI has something to call, and it is stated
  # as unexercised so nobody mistakes 'a script exists' for 'the Linux
  # build works'. Whoever first runs Linux CI should replace this
  # paragraph with the result."
  #
  # This job is that call. Its FIRST RUN IS AN EXPERIMENT, and an
  # experiment wired to every push turns CI red for reasons unrelated to
  # the commit that triggered it — which trains everyone to ignore CI,
  # costing more than the job is worth. Manual dispatch makes the first
  # run a deliberate act by someone who will read the result.
  #
  # PROMOTE IT TO `push` once it has gone green at least once, and
  # update build-lcms2.sh's header paragraph with the outcome — that is
  # an instruction the script asked for, not a suggestion.
  #
  # ★ WHY THE GATE IS THE BARE EXIT CODE AND NOTHING IS GREPPED.
  # The runner's contract (Report::exit_code) is:
  #     0  passed          1  a check FAILED
  #     2  harness/oracle ERROR    3  NOTHING RAN
  # `3` is the one that matters here: if lcms2 is missing every check
  # SKIPS, and a suite that skipped everything must not be able to
  # report success. Because that distinction is already in the exit
  # code, CI needs no output parsing — which is the point. This project
  # has twice shipped a false "all green" from piping test output
  # through `grep`/`tail` (grep exits 0 on a FAILED match; tail masks
  # the real status). The exit code is the evidence; the log is for
  # humans.
  #
  # Category (c) rows — those needing a Windows system profile — will
  # SKIP here and that is correct and expected. `skip` does not affect
  # the exit code.
  oracle:
    name: conformance suite vs pinned lcms2 (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ubuntu-latest ships cmake and build-essential; installed
      # explicitly anyway so a runner-image change fails HERE, with a
      # clear message, rather than inside build-lcms2.sh's toolchain
      # probe.
      - name: C toolchain for lcms2
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      # Exit 4 from this script means the tag moved and HEAD is not the
      # pinned commit. That is a hard stop by design: results attributed
      # to a version that did not produce them are worse than no results.
      - name: Fetch lcms2 at the pin
        run: sh tools/difftest/fetch-lcms2.sh
      - name: Build lcms2 (first ever exercise of this script)
        run: sh tools/difftest/build-lcms2.sh
      # The harness runs the SHIPPED binary as a subprocess, so it must
      # exist and must be the release build the records will name.
      - name: Build the iccce CLI (release)
        run: cargo build --release -p iccce-cli
      - name: Run the conformance suite
        working-directory: tools/difftest
        run: cargo run --release
      # Emitted for the record so a run's numbers are readable in the
      # log. Deliberately AFTER the gate above, and deliberately not
      # part of it.
      - name: Re-emit the summary and separation lines
        if: always()
        working-directory: tools/difftest
        run: cargo run --release 2>/dev/null | grep -E '^(summary|separation)' || true
