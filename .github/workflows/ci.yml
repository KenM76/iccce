# iccce CI — build and test on Linux AND Windows from the first commit.
#
# WHY both from day one (ROADMAP.md Pass 0): the sibling project's
# `main` did not compile on Linux for weeks because nothing checked.
# The check exists before there is anything interesting to check, so it
# can never be "added later".
#
# fmt and clippy run on Linux only — their verdicts are
# platform-independent, and running them twice buys nothing.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors in CI (and only in CI, so local iteration stays
  # frictionless). A warning that survives to CI is a decision nobody
  # made.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # ★ rustdoc is a SEPARATE warning channel from rustc. The `RUSTFLAGS:
      # -D warnings` above does NOT reach it — rustdoc reads RUSTDOCFLAGS —
      # so broken intra-doc links were invisible to this job from the first
      # commit. On 2026-08-12 an audit found 11 of them sitting in the tree
      # (7 were `[0,1]` in prose, which rustdoc parses as a link target and
      # silently drops from the rendered page; 2 pointed at `#[cfg(test)]`
      # items that do not exist in a doc build; 2 pointed at private types).
      #
      # This matters more than a normal lint because docs.rs renders these
      # crates for every published version and a dropped link is invisible
      # in the source — you only see it as missing text on the page. Per
      # DL-009 the docs are part of what gets published, so they get the
      # same "a warning that survives to CI is a decision nobody made"
      # treatment as the code.
      - name: rustdoc (intra-doc links)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
