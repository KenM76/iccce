# iccce-gen-profiles — the synthetic fixture generator.
#
# ---------------------------------------------------------------------------
# WHAT THIS IS, AND WHY IT IS NOT A LIBRARY CRATE
# ---------------------------------------------------------------------------
#
# Pass 2's done-when has two clauses. Clause 2 is "a synthetic corpus covers
# each tag type", and `docs/ROADMAP.md` recorded it PARTIAL because the only
# synthetic bytes this project had were authored *inside unit tests* — which
# are tag-level, not profile-level, and which nothing outside `cargo test` can
# consume. This crate is the other reading of that clause: whole profiles, on
# disk, in `fixtures/synthetic/`, that a differential run, a fuzzing run, or an
# external consumer can open.
#
# The load-bearing property is stated in `fixtures/synthetic/README.md`:
#
#     a synthetic fixture that cannot be regenerated is just a binary blob
#     with better branding.
#
# Everything about this crate follows from that sentence:
#
#   * Generation is DETERMINISTIC. No clock, no RNG, no environment. The
#     profile date/time is a hard-coded constant. `gen-profiles verify <dir>`
#     regenerates every recipe in memory and compares it byte-for-byte with
#     the file on disk; a fixture that has drifted is a hard failure, not a
#     diff nobody reads.
#   * The MANIFEST is GENERATED (`gen-profiles manifest`), so the invocation
#     recorded next to a fixture is by construction the invocation that
#     produced it.
#
# ---------------------------------------------------------------------------
# THIS CRATE IS DELIBERATELY NOT A WORKSPACE MEMBER
# ---------------------------------------------------------------------------
#
# Same mechanism, and the same two reasons, as `tools/difftest/Cargo.toml`:
# the empty `[workspace]` table below declares this package the root of its
# own one-package workspace, which is what stops cargo saying
#
#     error: current package believes it's in a workspace when it's not
#
# for a directory that sits underneath the workspace root without being a
# member. It is preferred over an `exclude = [...]` line in the root manifest
# because the root manifest belongs to `icc-engineer` and this file belongs to
# `icc-conformance`, and because `[workspace]` here is a positive statement at
# the place a reader is already looking.
#
# The invariant it protects is specific to a fixture generator and is worth
# stating plainly:
#
#     ★ A FIXTURE MUST NOT BE ABLE TO INHERIT A BUG FROM THE CODE IT TESTS.
#
# `LEGAL.md` §3 category (a) says a synthetic profile is unrestricted because
# this project authored it; `CLAUDE.md` rule 3 says an expectation derived from
# the code under test detects change, not error. Both die the moment this crate
# gains a dependency on `iccce-profile` — writing a fixture with the same
# encoder the parser was written against would make a shared misreading of the
# specification invisible. So:
#
#   * ZERO dependencies. Not third-party, and NOT iccce's own crates either.
#     Every byte below is written from a corpus layout cited in a doc comment,
#     with `std` alone. (Contrast `tools/difftest`, which *does* path-depend on
#     `iccce-color` — that is a harness measuring with a ground-truth-validated
#     ruler, and it is justified at length in its own manifest. A generator has
#     no equivalent justification available, and none is intended.)
#   * The arrow never reverses either: no crate under `crates/` may depend on
#     this one. Fixtures are inputs to tests, never to the engine.
#
# LEGAL.md §1 requires every dependency to be classified before it is added.
# The cheapest classification is the empty set.

[package]
name = "iccce-gen-profiles"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Byte-by-byte synthetic ICC profile generator for fixtures/synthetic. Not shipped; not a workspace member; no dependencies."
publish = false

# Declares this package the root of its own workspace. See the header.
[workspace]

[[bin]]
name = "gen-profiles"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
