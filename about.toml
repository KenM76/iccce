# iccce — cargo-about configuration.
#
# WHAT THIS IS. `docs/LEGAL.md` §1 states, without qualification, that
# `THIRD_PARTY_LICENSES.md` "is generated by `cargo-about`, never
# hand-written." This file plus `about.hbs` are that generator's entire
# input, and they exist so the rule is executable rather than aspirational
# — a hand-written licence manifest is exactly the kind of artefact that
# is correct on the day it is written and quietly wrong six months later.
#
# HOW TO REGENERATE (the whole procedure, so nobody has to derive it):
#
#     cargo install --locked cargo-about      # once, if not present
#     cargo about generate --workspace about.hbs -o THIRD_PARTY_LICENSES.md
#
# Run it before any publish, and after ANY dependency change in any
# `crates/*/Cargo.toml`. The output is committed; the command is the
# source of truth for it.
#
# THE CURRENT ANSWER, and why the file looks empty. As of 2026-08-12 this
# workspace has **zero third-party dependencies** — `Cargo.lock` contains
# exactly the four workspace members and nothing else, and every
# `[dependencies]` section is either empty or path-only. So the generated
# manifest correctly lists nothing. That is a real result and worth
# committing as one: it is the evidence for the claim, not a placeholder
# standing in for evidence.
#
# NOTE ON lcms2, because it is the obvious question. lcms2 is NOT a
# dependency of anything here and therefore correctly does not appear in
# the generated manifest. It is an out-of-tree differential oracle,
# invoked as a subprocess from `tools/difftest` (which is deliberately not
# a workspace member), with its source git-ignored. `docs/LEGAL.md` §4
# carries the full licence verification, including §4.2's finding that
# lcms2 is not uniformly MIT — its `fast_float` and `threaded` plugins are
# GPL-3.0 and are not built. A dependency-licence generator cannot see any
# of that, which is precisely why §4 is written out longhand and this
# generated file is not the whole licence story.

# The whitelist of SPDX licence expressions this project will accept in a
# dependency without an explicit operator decision. `cargo about generate`
# FAILS on any licence outside this list.
#
# ★ Permissive only, per `docs/LEGAL.md` §1: "Every dependency must be
# permissive; copyleft is flagged to the operator and never adopted
# unilaterally." Copyleft and weak-copyleft identifiers — GPL, LGPL, AGPL,
# MPL-2.0, EPL, CDDL — are ABSENT ON PURPOSE. Their absence is the
# enforcement mechanism: if a transitive dependency ever pulls one in, the
# generator hard-fails and the failure escalates to the operator, which is
# the behaviour §1 asks for. Do not add one here to make a build pass.
# Adding an identifier to this list is an operator decision and belongs in
# `docs/LEGAL.md` with a date.
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

# The platforms whose dependency graphs are considered. These are the two
# CI builds (`.github/workflows/ci.yml` matrix: ubuntu-latest,
# windows-latest). Listing them explicitly matters for a future dependency
# with per-target requirements: a licence that only appears in the Windows
# graph is still a licence this project ships.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# NOTE ON PER-CRATE SECTIONS. cargo-about 0.9.1 accepts, at the top level,
# only `accepted`, `targets`, `workarounds`, `ignore-*` keys and per-crate
# `[<crate-name>]` tables carrying `accepted`/`clarify`. A `[<name>]`
# table here means "overrides for the crate called <name>", so do not add
# one speculatively — a table naming a crate that is not in the graph is
# how a config silently stops matching what it was written for. There are
# currently no per-crate overrides because there are no third-party
# crates to override.

# --- Per-crate clarification: use THIS project's LICENSE text ----------
#
# WHY THIS IS HERE. cargo-about locates licence text by scanning each
# crate's own directory. The workspace keeps a single `LICENSE` at the
# repository root (each crate's `Cargo.toml` reaches it with
# `license-file = "../../LICENSE"`), so that scan finds nothing inside
# `crates/*/` and falls back to the **generic SPDX MIT template** — the
# one whose copyright line literally reads "Copyright (c) <year>
# <copyright holders>". Publishing that would look like an unfilled
# licence, which is worse than publishing nothing.
#
# A `clarify` block tells cargo-about exactly which file carries the
# licence text for a crate. The `checksum` is not optional decoration: it
# pins the file's content, so if `LICENSE` is ever edited the generator
# HARD-FAILS instead of silently emitting text nobody re-read. Recompute
# it with `sha256sum LICENSE` and update all four blocks together.
#
# Checksum below is of `LICENSE` as of 2026-08-12 (MIT, "Copyright (c)
# 2026 Ken Mantle").

[iccce-color.clarify]
license = "MIT"
[[iccce-color.clarify.files]]
path = "../../LICENSE"
checksum = "924b551cf24a232ecabcad4c21d0a91c24a65519dc1cdb6fb88cc395f8da74f5"

[iccce-profile.clarify]
license = "MIT"
[[iccce-profile.clarify.files]]
path = "../../LICENSE"
checksum = "924b551cf24a232ecabcad4c21d0a91c24a65519dc1cdb6fb88cc395f8da74f5"

[iccce-cmm.clarify]
license = "MIT"
[[iccce-cmm.clarify.files]]
path = "../../LICENSE"
checksum = "924b551cf24a232ecabcad4c21d0a91c24a65519dc1cdb6fb88cc395f8da74f5"

[iccce-cli.clarify]
license = "MIT"
[[iccce-cli.clarify.files]]
path = "../../LICENSE"
checksum = "924b551cf24a232ecabcad4c21d0a91c24a65519dc1cdb6fb88cc395f8da74f5"

# ★ ADDED 2026-08-17, and it was MISSING for five days. `iccce-measure`
# joined the workspace on 2026-08-12; this file was written on 2026-08-12
# with four blocks and nobody revisited it. The failure mode is the one
# the comment above describes and is SILENT: a workspace member with no
# `clarify` block does not error — cargo-about falls back to the generic
# SPDX MIT template, so regenerating would have emitted an entry reading
# "Copyright (c) <year> <copyright holders>" for a crate that is ours.
# Per the note above, that is "worse than publishing nothing", and it
# would have shipped in the first published tarball.
#
# ★ THE INVARIANT, stated so the next crate does not repeat this: THERE
# IS ONE `clarify` BLOCK PER `members` ENTRY IN THE ROOT `Cargo.toml`.
# Adding a workspace crate without adding a block here is a licence
# defect, not a formatting one. Check with:
#   diff <(grep -o 'crates/iccce-[a-z]*' Cargo.toml | sed 's|crates/||' | sort -u) #        <(grep -o '^\[iccce-[a-z]*\.clarify\]' about.toml | tr -d '[]' | sed 's|\.clarify||' | sort -u)
[iccce-measure.clarify]
license = "MIT"
[[iccce-measure.clarify.files]]
path = "../../LICENSE"
checksum = "924b551cf24a232ecabcad4c21d0a91c24a65519dc1cdb6fb88cc395f8da74f5"
