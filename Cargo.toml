# iccce — workspace manifest
#
# Five crates, per docs/ARCHITECTURE.md §1:
#
#   iccce-color    CIE colorimetry. INVARIANT: depends on nothing.
#   iccce-profile  ICC profile parsing. INVARIANT: no colour maths.
#   iccce-cmm      transforms — where profile and color meet, and where
#                  every approximation lives.
#   iccce-cli      the scriptable shell that makes the library verifiable
#                  without a GUI.
#   iccce-measure  CGATS/IT8.7 measurement files. INVARIANT: no ICC AND
#                  no colour maths — it reads numbers off a target, it
#                  does not interpret them. Pass 10 pre-work, added
#                  2026-08-12: the half of a profiler that needs no
#                  measurement hardware, buildable while the half that
#                  does waits.
#
# The invariants above are the architecture. Each is a statement about
# what a crate must NOT reach for, and each is checked by the fact that
# the crate's [dependencies] section stays empty — three of the five
# depend on nothing at all. A dependency added to iccce-color or
# iccce-measure is an architectural change, not a convenience.
#
# tools/difftest (the lcms2 differential oracle) is deliberately NOT a
# workspace member: lcms2 is an oracle, never a dependency, and keeping
# the harness out of the workspace guarantees the shipping crates cannot
# accidentally link it.

[workspace]
resolver = "2"
members = [
    "crates/iccce-color",
    "crates/iccce-profile",
    "crates/iccce-cmm",
    "crates/iccce-cli",
    "crates/iccce-measure",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/KenM76/iccce"
authors = ["Ken Mantle"]

[workspace.lints.rust]
# ARCHITECTURE.md §3.4: no `unsafe` without a written justification and a
# named rejected alternative. Deny at the workspace level; a justified
# exception carries an explicit, commented `#[allow]` at the site.
unsafe_code = "deny"

[workspace.lints.clippy]
# Numeric code is exactly where silent lossy casts hide. Make every
# narrowing conversion a deliberate, visible act.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
